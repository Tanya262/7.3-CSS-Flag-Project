<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flag Of Bahamas</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&display=swap" rel="stylesheet">
<style>
    .container{
         background-color: rgb(255, 255, 240);
        height: 250px;
         width: 330px;
        border: 5px solid rgb(0, 162, 173);
        border-radius: 10px;
        display: flex;
        justify-content: center;
    }
    
    .rectangle{
        background-color: rgb(0, 122, 140);
        width: 300px;
        height: 150px;
        position: absolute;
        margin-top: 85px;
        border: 2px solid gainsboro;
    }

    .rectangle2{
        background-color: rgb(255, 199, 44);
        height: 50px;
        position: relative;
        top: 50px;
    }

    .triangle{
        height: 0;
        width: 0;
        border-top: 75px solid color-mix(in srgb, pink 0%, transparent);
        border-bottom: 75px solid color-mix(in srgb, pink 0%, transparent);
        border-left: 90px solid black;
        border-right: 90px solid color-mix(in srgb, pink 0%, transparent);
        position: relative;
        bottom: 50px;
    }
    
    p{ 
        margin: 0px;
        font-family: "Patrick Hand", cursive;
        font-weight: 600;
        font-style: normal;
        font-size: 60px;
        position: relative;
        bottom: 2px;
        right: 2px;
    }
</style>
</head>
<body>
    <div class="container">
        <p>BAHAMAS</p>
        <div class="rectangle" draggable="true">
            <div class="rectangle2">
            <div class="triangle"></div>
            </div>
        </div>
    </div>
</body>
</html>
