<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flag Of Qatar</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&display=swap" rel="stylesheet">
<style>
    .container{
        background-color: rgb(255, 255, 240);
        height: 200px;
         width: 330px;
        border: 5px solid #D9D4C7;
        border-radius: 10px;
        display: flex;
        justify-content: center;
    }
    .rectangle{
        background-color: white;
        width: 300px;
        height: 118px;
        position: absolute;
        margin-top: 65px;
        border: 2px solid gainsboro;
    }  

    .triangle{
        background-color: #8D1B3D;
        width: 100%;
        height: 100%;
      clip-path: path("M 300 0 L 100 0 L 123.6 6.55 L 100 13.11 L 123.6 19.66 L 100 26.22 L 123.6 32.77 L 100 39.33 L 123.6 45.89 L 100 52.44 L 123.6 59 L 100 65.55 L 123.6 72.11 L 100 78.66 L 123.6 85.22 L 100 91.78 L 123.6 98.33 L 100 104.89 L 123.6 111.44 L 100 118 L 300 118 Z");
    }

    p{ 
        margin: 0px;
        font-family: "Patrick Hand", cursive;
        font-weight: 600;
        font-style: normal;
        font-size: 60px;
        position: relative;
        bottom: 11px;
        right: 2px;
    }
</style>
</head>
<body>
    <div class="container">
        <p>QATAR</p>
        <div class="rectangle" draggable="true">
            <div class="triangle"></div>
        </div>
    </div>
</body>
</html>
