<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flag Of Tanzania</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&display=swap" rel="stylesheet">
<style>
    .container{
        background-color: rgb(255, 255, 240);
        height: 280px;
         width: 330px;
        border: 5px solid #224D2A;
        border-radius: 10px;
        display: flex;
        justify-content: center;
    }

    .rectangle{
        background-color: rgb(252, 209, 22);
        width: 300px;
        height: 200px;
        position: absolute;
        margin-top: 65px;
        border: 2px solid gainsboro;
    }

    .triangle1{
        background-color: rgb(30, 181, 58);
        height: 100%;
        width: 100%;
        clip-path: polygon(0px 0px, 228.6px 0px, 0px 152.4px);
    }
    .triangle2{
        background-color: rgb(0, 163, 221);
        height: 100%;
        width: 100%;
        clip-path: polygon(300px 47.57px, 300px 200px, 71.36px 200px);
        position: absolute;
        bottom: 0;
    }

    .rectangle2 {
        background-color: black;
        height: 100%;
        width: 100%;
        clip-path: polygon(251.17px 0px, 300px 0px, 300px 32.55px, 
        46.82px 200px, 0px 200px, 0px 167.45px);
        position: absolute;
        bottom: 0px;
    }

    p{ 
        margin: 0px;
        font-family: "Patrick Hand", cursive;
        font-weight: 600;
        font-style: normal;
        font-size: 60px;
        position: relative;
        bottom: 9px;
        right: 2px;
    }
</style>
</head>
<body>
    <div class="container">
        <p>TANZANIA</p>
        <div class="rectangle" draggable="true">
            <div class="triangle1"></div>
            <div class="triangle2"></div>
            <div class="rectangle2"></div>
            <div></div>
        </div>
    </div>
</body>
</html>
