<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flag Of Thailand</title>
     <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&display=swap" rel="stylesheet">
<style>
    .container{
        background-color: rgb(255, 255, 240);
        height: 290px;
         width: 330px;
        border: 5px solid rgb(226, 38, 70);
        border-radius: 10px;
        display: flex;
        justify-content: center;
    }

    .rectangle{
        background-color: white;
        height: 200px;
        width: 300px;
        position: absolute;
        border: 2px solid gainsboro;
        margin-top: 75px;
    }

    .strip1 {
        background-color: rgb(237, 28, 36);
        width: 300px;
        height: 33.33px;
    }

    .strip2 {
        background-color: #F4F5F8;
        width: 300px;
        height: 33.33px;
    }

    .strip3 {
        background-color: rgb(45, 42, 79);
        width: 300px;
        height: 66.66px;
    }

    .strip4 {
        background-color: #F4F5F8;
        width: 300px;
        height: 33.33px;
    }

    .strip5 {
        background-color: rgb(237, 28, 36);
        width: 300px;
        height: 33.33px;
    }

    p{ 
        margin: 0px;
        font-family: "Patrick Hand", cursive;
        font-weight: 600;
        font-style: normal;
        font-size: 60px;
        position: relative;
        bottom: 2px;
        right: 2px;
    }
</style>
</head>
<body>
    <div class="container">
        <p>THAILAND</p>
        <div class="rectangle" draggable="true">
            <div class="strip1"></div>
            <div class="strip2"></div>
            <div class="strip3"></div>
            <div class="strip4"></div>
            <div class="strip5"></div>
            <div class="strip6"></div>
        </div>
    </div>
</body>
</html>
