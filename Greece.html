<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flag Of Greece</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&display=swap" rel="stylesheet">
<style>
    .container{
         background-color: rgb(255, 255, 240);
        height: 290px;
         width: 330px;
        border: 5px solid #2e96f1;
        border-radius: 10px;
        display: flex;
        justify-content: center;
    }

    .rectangle{
        background-color: black;
        height: 200px;
        width: 300px;
        position: absolute;
        border: 2px solid gainsboro;
        margin-top: 75px;
    }

    .square{
        background-color: #055EB0;
        height: 111.11px;
        width: 111.11px;
        position: relative;
        bottom: 200px;
    }

    .strip1{
        background-color: white;
        height: 111.11px;
        width: 22.22px;
        position: relative;
        left: 44.45px;
    }

    .strip2 {
        background-color: white;
        width: 111.11px;
        height: 22.22px;
        position: relative;
        bottom: 66.67px;
    }

    .blue1 {
        background-color: #055EB0;
        width: 300px;
        height: 22.22px;
    }

    .white1 {
        background-color: white;
        width: 300px;
        height: 22.22px;
    }

    .blue2 {
        background-color: #055EB0;
        width: 300px;
        height: 22.22px;
    }

    .white2 {
        background-color: white;
        width: 300px;
        height: 22.22px;
    }

    .blue3 {
        background-color: #055EB0;
        width: 300px;
        height: 22.22px;
    }

    .white3 {
        background-color: white;
        width: 300px;
        height: 22.22px;
    }

    .blue4 {
        background-color: #055EB0;
        width: 300px;
        height: 22.22px;
    }

    .white4 {
        background-color: white;
        width: 300px;
        height: 22.22px;
    }

    .blue5 {
        background-color: #055EB0;
        width: 300px;
        height: 22.22px;
    }

    p{ 
        margin: 0px;
        font-family: "Patrick Hand", cursive;
        font-weight: 600;
        font-style: normal;
        font-size: 60px;
        position: relative;
        bottom: 2px;
        right: 2px;
    }
</style>
</head>
<body>
    <div class="container">
        <p>GREECE</p>
        <div class="rectangle" draggable="true">
            <div class="blue1"></div>
            <div class="white1"></div>
            <div class="blue2"></div>
            <div class="white2"></div>
            <div class="blue3"></div>
            <div class="white3"></div>
            <div class="blue4"></div>
            <div class="white4"></div>
            <div class="blue5"></div>
            <div class="square">
                <div class="strip1"></div>
                <div class="strip2"></div>
            </div>
            
            
            
            
        </div>
    </div>
</body>
</html>
