<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NZ RedPeak</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&display=swap" rel="stylesheet">
<style>
    .container{
         background-color: rgb(255, 255, 240);
        height: 240px;
         width: 330px;
        border: 5px solid #C8102E;
        border-radius: 10px;
        display: flex;
        justify-content: center;
    }

    .rectangle{
        background-color: white;
        height: 150px;
        width: 300px;
        position: absolute;
        border: 2px solid gainsboro;
        margin-top: 75px;
    }

    #black {
        height: 0;
        width: 0;
        border-top: 150px solid black;
        border-bottom: 150px solid color-mix(in srgb, blue 0%, transparent);
        border-left: px solid color-mix(in srgb, grey 0%, transparent);
        border-right: 150px solid color-mix(in srgb, pink 0%, transparent);
    }

    #blue {
        height: 0;
        width: 0;
        transform: rotate(180);
        border-top: 150px solid rgb(17, 17, 204);
        border-bottom: 150px solid color-mix(in srgb, 0%, transparent);
        border-left: 150px solid color-mix(in srgb, yellow 0%, transparent);
        border-right: 0px solid color-mix(in srgb, paleturquoise 0%, transparent);
        position: relative;
        left: 150px;
        bottom: 300px;
    }

    .rectangle2 {
        background-color: white;
        width: 150px;
        height: 75px;
        position: relative;
        bottom: 375px;
        left: 75px;
    }
    .triangle3{
        height: 0;
        width: 0;
        border-top: 75px solid color-mix(in srgb, rgb(63, 233, 11) 0%, transparent);
        border-bottom: 75px solid rgb(204, 0, 0);
        border-left: 75px solid color-mix(in srgb, rgb(218, 12, 81) 0%, transparent);
        border-right: 75px solid color-mix(in srgb, rgb(88, 8, 238) 0%, transparent);
        position: relative;
        bottom: 75px;
    }

    p{ 
        margin: 0px;
        font-family: "Patrick Hand", cursive;
        font-weight: 600;
        font-style: normal;
        font-size: 60px;
        position: relative;
        bottom: 2px;
        right: 2px;
    }
</style>
</head>
<body>
    <div class="container">
        <p>NZ REDPEAK</p>
        <div class="rectangle" draggable="true">
            <div class="triangle1" id="black"></div>
            <div class="triangle2" id="blue"></div>
            <div class="rectangle2">
            <div class="triangle3" id="red"></div>
            </div>
        </div>
    </div>
</body>
</html>
