<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flag Of Czech Republic</title>
     <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&display=swap" rel="stylesheet">
<style>
    .container{
        background-color: rgb(255, 255, 240);
        height: 290px;
         width: 330px;
        border: 5px solid #9B2B2C;
        border-radius: 10px;
        display: flex;
        justify-content: center;
    }

    .rectangle{
        background-color: rgb(215, 20, 26);
        width: 300px;
        height: 200px;
        position: absolute;
        margin-top: 70px;
        border: 2px solid gainsboro;
    }

    .rectangle2{
        background-color: white;
        height: 100px;
    }

    .triangle{
        background-color: rgb(17, 69, 126);
        height: 100%;
        width: 100%;
        clip-path: polygon(0px 0px, 0px 200px, 150px 100px);
        position: relative;
        bottom: 100px;
    }

    p{ 
        margin: 0px;
        font-family: "Patrick Hand", cursive;
        font-weight: 600;
        font-style: normal;
        font-size: 50px;
        position: relative;
        bottom: 2px;
        right: 2px;
    }
</style>
</head>
<body>
    <div class="container">
        <p>CZECH REPUBLIC</p>
        <div class="rectangle" draggable="true">
            <div class="rectangle2"></div>
            <div class="triangle"></div>
        </div>
    </div>
</body>
</html>
