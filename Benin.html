<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flag Of Benin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&display=swap" rel="stylesheet">
<style>
    .container{
        background-color: rgb(255, 255, 240);
        height: 290px;
         width: 330px;
        border: 5px solid #CE9D0C;
        border-radius: 10px;
        display: flex;
        justify-content: center;
    }

    .rectangle{
        background-color: palevioletred;
        height: 200px;
        width: 300px;
        position: absolute;
        border: 2px solid gainsboro;
        margin-top: 80px;
    }

    .rectangle2 {
        background-color: rgb(0, 136, 80);
        height: 200px;
        width: 100px;
        position: relative;
        bottom: 200px;
    }

    .rectangle3 {
        background-color: rgb(252, 210, 15);
        height: 100px;
    }

    .rectangle4 {
        background-color: rgb(233, 9, 41);
        height: 100px;
    }

    p{ 
        margin: 0px;
        font-family: "Patrick Hand", cursive;
        font-weight: 600;
        font-style: normal;
        font-size: 60px;
        position: relative;
        bottom: 2px;
        right: 2px;
    }
</style>
</head>
<body>
    <div class="container">
        <p>BENIN</p>
        <div class="rectangle" draggable="true">
            <div class="rectangle3"></div>
            <div class="rectangle4"></div>
            <div class="rectangle2"></div>
        </div>
    </div>
</body>
</html>
