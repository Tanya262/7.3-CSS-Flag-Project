<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flag Of Gabon</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&display=swap" rel="stylesheet">
<style>
    .container{
        background-color: rgb(255, 255, 240);
        height: 305px;
         width: 330px;
        border: 5px solid #7B5336;
        border-radius: 10px;
        display: flex;
        justify-content: center;
    }

    .rectangle{
        background-color: rgb(58, 117, 196);
        height: 225px;
        width: 300px;
        position: absolute;
        border: 2px solid gainsboro;
        margin-top: 65px;
    }

    .rectangle2{
        background-color: rgb(0, 158, 96);
        height: 75px;
    }

    .rectangle3{
        background-color: rgb(252, 209, 22);
        height: 75px;
    }

    p{ 
        margin: 0px;
        font-family: "Patrick Hand", cursive;
        font-weight: 600;
        font-style: normal;
        font-size: 60px;
        position: relative;
        bottom: 10px;
        right: 2px;
    }
</style>
</head>
<body>
    <div class="container">
        <p>GABON</p>
        <div class="rectangle" draggable="true">
            <div class="rectangle2"></div>
            <div class="rectangle3"></div>
        </div>
    </div>
</body>
</html>
