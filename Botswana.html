<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flag Of Botswana</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&display=swap" rel="stylesheet">
<style>
    .container{
        background-color: rgb(255, 255, 240);
        height: 290px;
         width: 330px;
        border: 5px solid #C49B74;
        border-radius: 10px;
        display: flex;
        justify-content: center;
    }
    
    .rectangle{
        background-color: rgb(117, 170, 219);
        width: 300px;
        height: 200px;
        position: absolute;
        margin-top: 70px;
        border: 2px solid gainsboro;
    }

    .blue1{
        background-color: rgb(117, 170, 219);
        width: 300px;
        height: 75px;
    }

    .white1{
        background-color: white;
        width: 300px;
        height: 8.33px;
    }

    .black{
        background-color: black;
        width: 300px;
        height: 33.33px;
    }

    .white2 {
        background-color: white;
        width: 300px;
        height: 8.33px;
    }

    p{ 
        margin: 0px;
        font-family: "Patrick Hand", cursive;
        font-weight: 600;
        font-style: normal;
        font-size: 60px;
        position: relative;
        bottom: 2px;
        right: 2px;
    }
</style>
</head>
<body>
    <div class="container">
        <p>BOTSWANA</p>
        <div class="rectangle" draggable="true">
            <div class="blue1"></div>
            <div class="white1"></div>
            <div class="black"></div>
            <div class="white2"></div>
        </div>
    </div>
</body>
</html>
