<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flag Of Finland</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&display=swap" rel="stylesheet">
<style>
    .container{
        background-color: rgb(255, 255, 240);
        height: 300px;
         width: 370px;
        border: 5px solid #084ba3;
        border-radius: 10px;
        display: flex;
        justify-content: center;
    }

    .rectangle{
        background-color: white;
        height: 200px;
        width: 327.27px;
        position: absolute;
        border: 2px solid gainsboro;
        margin-top: 80px;
    }

    .rectangle2{
        background-color: #002F6C;
        height: 54.55px;
        width: 327.27px;
        position: relative;
        top: 72.73px;
    }

    .rectangle3 {
        background-color: #002F6C;
        height: 200px;
        width: 54.55px;
        position: relative;
        bottom: 55px;
        left: 90.93px;
    }

    p{ 
        margin: 0px;
        font-family: "Patrick Hand", cursive;
        font-weight: 600;
        font-style: normal;
        font-size: 60px;
        position: relative;
        bottom: 2px;
        right: 2px;
    }
</style>

</head>
<body>
    <div class="container">
        <p>FINLAND</p>
        <div class="rectangle" draggable="true">
            <div class="rectangle2"></div>
            <div class="rectangle3"></div>
        </div>
    </div>
</body>
</html>
