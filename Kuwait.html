<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flag Of Kuwait</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&display=swap" rel="stylesheet">
<style>
    .container{
        background-color: rgb(255, 255, 240);
        height: 225px;
         width: 330px;
        border: 5px solid #d6b27b;
        border-radius: 10px;
        display: flex;
        justify-content: center;
    }    

    .rectangle{
        background-color: rgb(206, 17, 38);
        width: 300px;
        height: 150px;
        position: absolute;
        margin-top: 60px;
        border: 2px solid gainsboro;
    }

    .rectangle2 {
        background-color: rgb(0, 122, 61);
        width: 300px;
        height: 50px;
    }

    .rectangle3 {
        background-color: white;
        width: 300px;
        height: 50px;
    }

    .trapezium{
        background-color: black;
        height: 100%;
        width: 100%;
        clip-path: polygon(0px 0px, 75px 50px, 75px 100px, 0px 150px);
        position: absolute;
        bottom: 0px;
    }

    p{ 
        margin: 0px;
        font-family: "Patrick Hand", cursive;
        font-weight: 600;
        font-style: normal;
        font-size: 60px;
        position: relative;
        right: 2px;
        bottom: 11px;
    }
</style>
</head>
<body>
    <div class="container">
        <p>KUWAIT</p>
        <div class="rectangle" draggable="true">
            <div class="rectangle2"></div>
            <div class="rectangle3"></div>
            <div class="trapezium"></div>
        </div>
    </div>
</body>
</html>
