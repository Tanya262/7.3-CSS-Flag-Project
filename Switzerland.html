<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flag Of Switzerland</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&display=swap" rel="stylesheet">
<style>
    .container{
        background-color: rgb(255, 255, 240);
        height: 280px;
         width: 250px;
        border: 5px solid #f14037;
        border-radius: 10px;
        display: flex;
        justify-content: center;
    }

    .rectangle{
        background-color: #FF0000;
        height: 200px;
        width: 200px;
        position: absolute;
        border: 2px solid gainsboro;
        margin-top: 65px;
    }

    .rectangle2{
        background-color: white;
        height: 200px;
        width: 37.5px;
        position: relative;
        left: 81.25px;
    }

    .rectangle3 {
        background-color: white;
        height: 37.5px;
        width: 200px;
        position: relative;
        bottom: 118.75px;
    }

    p{ 
        margin: 0px;
        font-family: "Patrick Hand", cursive;
        font-weight: 600;
        font-style: normal;
        font-size: 45px;
        position: relative;
        bottom: 1px;
        right: 2px;
    }
</style>
</head>
<body>
    <div class="container">
        <p>SWITZERLAND</p>
        <div class="rectangle" draggable="true">
            <div class="rectangle2"></div>
            <div class="rectangle3"></div>
        </div>
    </div>
</body>
</html>
