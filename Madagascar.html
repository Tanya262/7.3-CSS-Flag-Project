<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flag Of Madagascar</title>
     <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&display=swap" rel="stylesheet">
<style>
    .container{
        background-color: rgb(255, 255, 240);
        height: 287px;
         width: 330px;
        border: 5px solid #6E473B;
        border-radius: 10px;
        display: flex;
        justify-content: center;
    }

    .rectangle{
        background-color: rgb(0, 126, 58);
        width: 300px;
        height: 200px;
        position: absolute;
        margin-top: 70px;
        border: 2px solid gainsboro;
    }

    .rectangle2 {
        background-color: rgb(252, 61, 50);
        width: 300px;
        height: 100px;
    }

    .rectangle3{
        background-color: white;
        width: 100px;
        height: 200px;
        position: absolute;
        bottom: 0;
    }

    p{ 
        margin: 0px;
        font-family: "Patrick Hand", cursive;
        font-weight: 600;
        font-style: normal;
        font-size: 50px;
        position: relative;
        right: 2px;
    }
</style>
</head>
<body>
    <div class="container">
        <p>MADAGASCAR</p>
        <div class="rectangle" draggable="true">
            <div class="rectangle2"></div>
            <div class="rectangle3"></div>
            <div class="rectangle4"></div>
        </div>
    </div>  
</body>
</html>
