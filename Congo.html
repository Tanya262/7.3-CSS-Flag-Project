<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flag Of Congo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&display=swap" rel="stylesheet">
<style>
    .container{
        background-color: rgb(255, 255, 240);
        height: 280px;
         width: 330px;
        border: 5px solid #145A32;
        border-radius: 10px;
        display: flex;
        justify-content: center;
    }

    .rectangle{
        background-color: rgb(251, 222, 74);
        width: 300px;
        height: 200px;
        position: absolute;
        margin-top: 60px;
        border: 2px solid gainsboro;
    }

    .triangle1{
        background-color: rgb(0, 149, 67);
        height: 100%;
        width: 100%;
        clip-path: polygon(0px 0px, 0px 200px, 200px 0px);
    }

    .triangle2 {
        background-color: rgb(220, 36, 31);
        height: 100%;
        width: 100%;
        clip-path: polygon(0px 0px, 0px 200px, 200px 0px);
        transform: rotate(180deg);
        position: relative;
        bottom: 200px;
    }

    p{ 
        margin: 0px;
        font-family: "Patrick Hand", cursive;
        font-weight: 600;
        font-style: normal;
        font-size: 40px;
        position: relative;
        bottom: 1px;
        right: 2px;
        text-align: center;
    }
</style>
</head>
<body>
    <div class="container">
        <p>REPUBLIC OF <span>CONGO</span></p>
        <div class="rectangle" draggable="true">
            <div class="triangle1"></div>
            <div class="triangle2"></div>
        </div>
    </div>
</body>
</html>
