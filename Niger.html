<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flag Of Niger</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&display=swap" rel="stylesheet">
<style>
    .container{
        background-color: rgb(255, 255, 240);
        height: 340px;
         width: 330px;
        border: 5px solid #db7643;
        border-radius: 10px;
        display: flex;
        justify-content: center;
    }

    .rectangle{
        background-color: rgb(13, 176, 43);
        width: 300px;
        height: 257.14px;
        position: absolute;
        margin-top: 70px;
        border: 2px solid gainsboro;
    }

    .rectangle2{
        background-color: rgb(224, 82, 6);
        width: 300px;
        height: 85.71px;
    }

    .rectangle3 {
        background-color: white;
        width: 300px;
        height: 85.71px;
    }

    .circle {
        background-color: rgb(224, 82, 6);
        height: 57.14px;
        width: 57.14px;
        border-radius: 57.14px;
        position: relative;
        bottom: 72px;      
        left: 121.43px;  
    }

    p{ 
        margin: 0px;
        font-family: "Patrick Hand", cursive;
        font-weight: 600;
        font-style: normal;
        font-size: 60px;
        position: relative;
        bottom: 2px;
        right: 2px;
    }
</style>
</head>
<body>
    <div class="container" draggable="true">
         <p>NIGER</p>
        <div class="rectangle">
            <div class="rectangle2"></div>
            <div class="rectangle3"></div>
            <div class="circle"></div>
        </div>
    </div>
</body>
</html>
