<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flag Of Trinidad</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&display=swap" rel="stylesheet">
<style>
    .container{
        background-color: rgb(255, 255, 240);
        height: 280px;
         width: 330px;
        border: 5px solid #c95254;
        border-radius: 10px;
        display: flex;
        justify-content: center;
    }

    .rectangle{
        background-color: white;
        width: 300px;
        height: 200px;
        position: absolute;
        margin-top: 65px;
        border: 2px solid gainsboro;
    }

    .triangle1{
        background-color: rgb(206, 17, 38);
        width: 300px;
        height: 100%;
        clip-path: polygon(0px 0px, 225px 200px, 0px 200px);
        position: absolute;
        bottom: 0px;
    }

    .triangle2{
        background-color: rgb(206, 17, 38);
        width: 100%;
        height: 100%;
        clip-path: polygon(75px 0px, 300px 0px, 300px 200px);
    }

    .strip1{
        background-color: black;
        width: 100%;
        height: 100%;
        clip-path: polygon(10px 0px, 65px 0px, 
        290px 200px,235px 200px);
        position: absolute;
        bottom: 0;
    }

    p{ 
        margin: 0px;
        font-family: "Patrick Hand", cursive;
        font-weight: 600;
        font-style: normal;
        font-size: 45px;
        position: relative;
        right: 2px;
    }
</style>
</head>
<body>
    <div class="container">
        <p>TRINIDAD&TOBAGO</p>
        <div class="rectangle" draggable="true">
            <div class="triangle1"></div>
            <div class="triangle2"></div>
            <div class="strip1"></div>
        </div>
    </div>
</body>
</html>
