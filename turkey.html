<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flag of Turkey</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&display=swap" rel="stylesheet">
<style>
    .container{
        background-color: rgb(255, 255, 240);
        height: 280px;
         width: 330px;
        border: 5px solid #9c282a;
        border-radius: 10px;
        display: flex;
        justify-content: center;
    }

    .rectangle{
        background-color: rgb(227, 10, 23);
        height: 200px;
        width: 300px;
        position: absolute;
        border: 2px solid gainsboro;
        margin-top: 65px;
    }

    .circle1 {
        background-color: white;
        height: 100px;
        width: 100px;
        border-radius: 100px;
    }

    .circle2{
        background-color: rgb(227, 10, 23);
        height: 80px;
        width: 80px;
        border-radius: 80px;
        position: absolute;
        top: 0;
    }

    .circle{
        transform: rotate(140deg);
        position: absolute;
        top: 50px;
        left: 56.67px;
    }

    .star{
        background-color: white;
        height: 55px;
        width: 55px;
        clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 95%, 50% 72%, 21% 95%, 32% 57%, 2% 35%, 39% 35% );
        position: absolute;
        top: 75px;
        left: 145px;
        transform: rotate(270deg);
    } 

    p{ 
        margin: 0px;
        font-family: "Patrick Hand", cursive;
        font-weight: 600;
        font-style: normal;
        font-size: 60px;
        position: relative;
        bottom: 9px;
        right: 2px;
    }
</style>
</head>
<body>
    <div class="container">
        <p>TURKEY</p>
        <div class="rectangle" draggable="true">
           <div class="circle"> 
            <div class="circle1"></div>
            <div class="circle2"></div>
        </div>
            <div class="star"></div>
        </div>
    </div>
</body>
</html>
