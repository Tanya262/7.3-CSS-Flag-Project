<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&display=swap" rel="stylesheet">
<style>
    .container{
        background-color: rgb(255, 255, 240);
        height: 300px;
        width: 330px;
        border: 5px solid #fa8e8e;
        border-radius: 10px;
        display: flex;
        justify-content: center;
    }

    .rectangle{
        background-color: white;
        height: 200px;
        width: 300px;
        position: absolute;
        border: 2px solid gainsboro;
        margin-top: 80px;
    }

    .circle{
        background-color: #BE0029;
        height: 100px;
        width: 100px;
        border-radius: 100px;
        position: relative;
        top: 50px;
        left: 95px;
    }

    p{ 
        margin: 0px;
        font-family: "Patrick Hand", cursive;
        font-weight: 600;
        font-style: normal;
        font-size: 60px;
        position: relative;
        bottom: 2px;
        right: 2px;
    }
</style>
</head>
<body>
    <div class="container">
        <p>JAPAN</p>
        <div class="rectangle" draggable="true">
            <div class="circle"></div>
        </div>
    </div>
</body>
</html>
