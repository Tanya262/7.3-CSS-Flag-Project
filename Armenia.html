<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flag Of Armenia</title>
      <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&display=swap" rel="stylesheet">
<style>
    .container{
        background-color: rgb(255, 255, 240);
        height: 235px;
         width: 330px;
        border: 5px solid #C96D1D;
        border-radius: 10px;
        display: flex;
        justify-content: center;
    }
    
    .rectangle{
        background-color: rgb(242, 168, 0);
        width: 300px;
        height: 150px;
        position: absolute;
        margin-top: 70px;
        border: 2px solid gainsboro;
    }

    .rectangle2{
        background-color: rgb(217, 0, 18);
        height: 150px;
        width: 100px;
    }

    .rectangle3 {
        background-color: rgb(0, 51, 160);
        height: 150px;
        width: 100px;
        position: relative;
        bottom: 150px;
        left: 100px;
    }

    p{ 
        margin: 0px;
        font-family: "Patrick Hand", cursive;
        font-weight: 600;
        font-style: normal;
        font-size: 60px;
        position: relative;
        bottom: 9px;
        right: 2px;
    }
</style>
</head>
<body>
    <div class="container">
        <p>ARMENIA</p>
        <div class="rectangle" draggable="true">
            <div class="rectangle2"></div>
            <div class="rectangle3"></div>
        </div>
    </div>
</body>
</html>
